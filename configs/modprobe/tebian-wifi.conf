# Installed by Tebian as /etc/modprobe.d/tebian-wifi.conf.
#
# Realtek rtw88 Wi-Fi (RTL8822BU/8821CU USB sticks such as TP-Link's Archer
# T3U, and the 8822BE/8821CE/8822CE cards in many laptops): in its deep
# power-save state the chip's firmware can stop answering. The kernel then
# logs "failed to get tx report from firmware", nothing can be sent, every
# reconnect times out and no networks are listed until the next reboot.
# Keeping the chip out of that state costs a little battery and stops the
# hang. Only read when an rtw88 driver loads; other Wi-Fi is not affected.
options rtw88_core disable_lps_deep=y
