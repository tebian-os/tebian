# Tebian — XDG redirects for apps that don't respect XDG by default
# but DO honor specific environment variables. Keeps $HOME tidy.
#
# Anything not covered here (Steam, Minecraft, Mozilla, etc.) is handled
# by symlinks via tebian-tidy-home.

# ── Rust ──
CARGO_HOME=$HOME/.local/share/cargo
RUSTUP_HOME=$HOME/.local/share/rustup

# ── Go ──
GOPATH=$HOME/.local/share/go

# ── Node / npm ──
NPM_CONFIG_USERCONFIG=$HOME/.config/npm/npmrc

# ── Bun ──
BUN_INSTALL=$HOME/.local/share/bun

# ── Java / Gradle / Android ──
GRADLE_USER_HOME=$HOME/.local/share/gradle
ANDROID_USER_HOME=$HOME/.local/share/android
ANDROID_HOME=$HOME/.local/share/android

# ── Python ──
PYTHONHISTORY=$HOME/.local/state/python_history

# ── Less pager history ──
LESSHISTFILE=$HOME/.local/state/less/history

# ── wget ──
WGETRC=$HOME/.config/wgetrc

# ── readline (bash/python REPL) ──
INPUTRC=$HOME/.config/readline/inputrc
