set default=0
set timeout=5

# Filesystem and partition modules
insmod part_gpt
insmod part_msdos
insmod fat
insmod ext2
insmod iso9660
insmod loopback

# Graphics
insmod all_video
insmod gfxterm
insmod png
if loadfont /boot/grub/unicode.pf2; then
    set gfxmode=auto
    terminal_output gfxterm
fi

if [ -e /boot/grub/live-theme/theme.txt ]; then
    set theme=/boot/grub/live-theme/theme.txt
fi

# Kernel paths (@@KERNEL_VERSION@@ replaced at build time)
set kern=/live/vmlinuz-@@KERNEL_VERSION@@
set init=/live/initrd.img-@@KERNEL_VERSION@@

# One loader for both platforms: Debian's GRUB 2.12 has no separate
# linuxefi module (EFI handover is built into "linux"), and the signed UEFI
# image used under Secure Boot has it compiled in already
insmod linux

# Only search for root if not already set (Ventoy/loopback sets root for us)
if [ -z "$root" ] || ! [ -e /live/filesystem.squashfs ]; then
    search --set=root --file /live/filesystem.squashfs
fi

# Detect boot context for live-boot findiso support
set extra=""
if [ -n "$iso_path" ]; then
    set extra="findiso=$iso_path"
fi

menuentry "Tebian OS" {
    set gfxpayload=keep
    linux $kern boot=live components toram quiet splash loglevel=0 vt.global_cursor_default=0 cfg80211.ieee80211_regdom=00 $extra
    initrd $init
}

# toram copies the system into memory so the USB can be pulled and the
# installer runs at RAM speed. live-boot already skips the copy when memory
# is short, but on ~2 GB machines the copy can still fit and leave too
# little for the installer — this entry runs straight from the USB instead.
menuentry "Tebian OS (low memory — run from USB)" {
    set gfxpayload=keep
    linux $kern boot=live components quiet splash loglevel=0 vt.global_cursor_default=0 cfg80211.ieee80211_regdom=00 $extra
    initrd $init
}

menuentry "Tebian OS (safe graphics)" {
    set gfxpayload=keep
    linux $kern boot=live components toram nomodeset cfg80211.ieee80211_regdom=00 $extra
    initrd $init
}
