# ==============================================================================
# TEBIAN SYSTEM MANIFEST — defaults
# Apply changes: tebian-rebuild
#
# This machine's own choices go in ~/.config/tebian/machine.conf (same
# KEY="value" format), which is read after this file and wins. Settings
# records theme, security profile, Tor and DNS privacy there, so they survive
# updates, Rebuild and re-running the installer. This file is Tebian's: on a
# fleet machine it is the fleet's manifest in git — edit it there, not here.
# ==============================================================================

# Security profile: minimal | standard | hardened | paranoid
# paranoid = hardened + transparent Tor (all traffic) + MAC randomization
SECURITY_PROFILE="standard"

# Tor routing (per-app via proxychains4, NOT system-wide)
# Note: paranoid profile uses transparent Tor instead (forces ALL traffic)
ENABLE_TOR="no"

# DNS-over-TLS via systemd-resolved
ENABLE_DNS_PRIVACY="no"
DNS_PROVIDER="quad9"  # quad9 | cloudflare

# Extra apt packages to install
EXTRA_PACKAGES=()

# Systemd services to enable
ENABLE_SERVICES=()

# Systemd services to disable
DISABLE_SERVICES=()

# Theme name (matches ~/Tebian/configs/themes/<name>/)
# Settings → Themes records your choice in machine.conf
TEBIAN_THEME="glass"

# Update channel for tebian-update
#   stable = latest release, checksum-verified (recommended)
#   main   = development branch, unverified
TEBIAN_CHANNEL="stable"
# Fleet machines: install with install.sh --repo <git URL>; tebian-update
# then pulls that clone
